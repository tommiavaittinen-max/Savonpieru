<!DOCTYPE html>
<html lang="fi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eemin Pierukommentaattori</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --text: #f0f2f5;
      --muted: #8b949e;
      --accent: #3fb950;
      --warn: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid #2a2f3a;
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; letter-spacing: -0.02em; }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

    .meter-container {
      width: 100%;
      height: 14px;
      background: #0b0d10;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.05s linear, background 0.1s;
    }
