<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eemin Pierukommentaattori</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --text: #f0f2f5;
      --muted: #8b949e;
      --accent: #3fb950;
      --warn: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid #2a2f3a;
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; letter-spacing: -0.02em; }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

    .meter-container {
      width: 100%;
      height: 14px;
      background: #0b0d10;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.05s linear, background 0.1s;
    }
    .threshold-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--danger);
      left: 40%;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
    }

    .roast-box {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      line-height: 1.4;
      color: #e6edf3;
      background: #12151a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      font-style: italic;
    }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    button {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-stop { background: var(--danger); color: #fff; }
    .btn-secondary { background: #2a2f3a; color: var(--text); font-size: 0.9rem; }

    .slider-group {
      margin-top: 16px;
      text-align: left;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .slider-group label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
  </style>
</head>
<body>

  <div class="card">
    <h1>Eemin Pierukommentaattori</h1>
    <div id="status" class="status">Valmiustilassa</div>

    <div class="meter-container">
      <div id="meter" class="meter-fill"></div>
      <div id="thresholdLine" class="threshold-line"></div>
    </div>

    <div class="stats-row">
      <span>Tausta: <strong id="noiseStat">0</strong></span>
      <span>Suhde: <strong id="ratioStat">0.0</strong>x</span>
      <span>Eemin osumat: <strong id="countStat">0</strong></span>
    </div>

    <div id="roastBox" class="roast-box">
      "Paina käynnistä ja anna palaa, Eemi..."
    </div>

    <div class="controls">
      <button id="toggleBtn" class="btn-primary">Käynnistä kuuntelu</button>
      <button id="testBtn" class="btn-secondary">Testaa ääni & solvaus</button>
    </div>

    <div class="slider-group">
      <label>
        <span>Herkkyys (ylitys taustamelusta)</span>
        <span id="thresholdVal">35</span>
      </label>
      <input type="range" id="thresholdSlider" min="10" max="100" value="35">
    </div>

    <div class="slider-group">
      <label>
        <span>Puheensuodatus (Basso/Diskantti-suhde)</span>
        <span id="ratioVal">2.0</span>
      </label>
      <input type="range" id="ratioSlider" min="1.2" max="4.0" step="0.1" value="2.0">
    </div>
  </div>

  <script>
    const roasts = {
      short: [
        "Eemi, oliko tuo pieru vai astuitko hiiren päälle? Säälittävä yritys.",
        "Aika ujo pihaus, Eemi. Eikö suolistosta löydy enempää kunnianhimoa?",
        "Tuo oli niin varovainen, Eemi, että se melkein pyysi anteeksi olemassaoloaan.",
        "Yritä edes, Eemi. Tuo ei riitä edes alkulämmittelyksi."
      ],
      squeaker: [
        "Eemi, tuo kuulosti tyhjenevältä ilmapallolta. Onko vähän kireä tunnelma?",
        "Vinkaisi kuin vanha saranatappi. Suosittelen öljyämistä, Eemi.",
        "Korkea ja kireä. Eemi päästi selvästi paineella läpi.",
        "Mitä ihmettä, Eemi? Nielaisitko vinkulelun?"
      ],
      medium: [
        "No niin Eemi, nyt on taas huoneilma pilalla. Kiitos tästä taideteoksesta.",
        "Tuon äänen perusteella suosittelen Eemille vakavasti ruokavalion tarkistamista.",
        "Hyvä yritys, Eemi, mutta naapurit eivät vielä soittaneet palokuntaa.",
        "Klassinen suoritus Eemiltä. Hajuhaittoja odotellessa."
      ],
      heavy: [
        "Varoitus! Eemiltä havaittu myrkyllinen kaasupurkaus. Evakuoikaa huone välittömästi!",
        "Tuo ei ollut enää pieru, Eemi, tuo oli suoliston hätähuuto. Onko housut vielä ehjät?",
        "Mahtava bassoraita! Sääli vain, että se tuli Eemin takapuolesta.",
        "Herra varjele, Eemi. Tuo tärinä tuntui varmaan naapurikunnassa asti."
      ]
    };

    let audioCtx, analyser, micStream, dataArray;
    let isListening = false;
    let animationId;

    // Tunnistuksen tilamuuttujat
    let noiseFloor = 15;
    let soundStartTime = 0;
    let peakEnergy = 0;
    let lowSumEvent = 0;
    let midSumEvent = 0;
    let frameCountEvent = 0;
    let isSoundActive = false;
    let lastRoastTime = 0;
    let fartCount = 0;
    const COOLDOWN_MS = 4500;

    // UI-elementit
    const toggleBtn = document.getElementById('toggleBtn');
    const testBtn = document.getElementById('testBtn');
    const statusEl = document.getElementById('status');
    const meterEl = document.getElementById('meter');
    const roastBox = document.getElementById('roastBox');
    const slider = document.getElementById('thresholdSlider');
    const thresholdVal = document.getElementById('thresholdVal');
    const thresholdLine = document.getElementById('thresholdLine');
    const ratioSlider = document.getElementById('ratioSlider');
    const ratioVal = document.getElementById('ratioVal');
    const noiseStat = document.getElementById('noiseStat');
    const ratioStat = document.getElementById('ratioStat');
    const countStat = document.getElementById('countStat');

    function updateUI() {
      const val = parseInt(slider.value, 10);
      thresholdVal.textContent = val;
      ratioVal.textContent = parseFloat(ratioSlider.value).toFixed(1);
    }
    slider.addEventListener('input', updateUI);
    ratioSlider.addEventListener('input', updateUI);
    updateUI();

    function getBandAverage(data, binHz, minHz, maxHz) {
      const startBin = Math.max(1, Math.floor(minHz / binHz));
      const endBin = Math.min(data.length - 1, Math.ceil(maxHz / binHz));
      let sum = 0;
      let count = 0;
      for (let i = startBin; i <= endBin; i++) {
        sum += data[i];
        count++;
      }
      return count > 0 ? sum / count : 0;
    }

    function speakRoast(category) {
      const list = roasts[category];
      const text = list[Math.floor(Math.random() * list.length)];
      roastBox.textContent = `"${text}"`;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fi-FI';
      utterance.rate = 1.05;
      utterance.pitch = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const fiVoice = voices.find(v => v.lang.startsWith('fi'));
      if (fiVoice) utterance.voice = fiVoice;

      lastRoastTime = Date.now();
      window.speechSynthesis.speak(utterance);
    }

    function analyzeAudio() {
      if (!isListening) return;
      animationId = requestAnimationFrame(analyzeAudio);

      if (window.speechSynthesis.speaking || Date.now() - lastRoastTime < COOLDOWN_MS) {
        meterEl.style.width = '0%';
        isSoundActive = false;
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      const binHz = audioCtx.sampleRate / analyser.fftSize;

      // Taajuuskaistat
      const lowEnergy = getBandAverage(dataArray, binHz, 60, 320);    // Basso / jyrinä
      const midEnergy = getBandAverage(dataArray, binHz, 320, 900);   // Pärinä / vinkaisu
      const highEnergy = getBandAverage(dataArray, binHz, 1500, 4500); // Puhe / kolaukset

      const fartBand = (lowEnergy * 0.65) + (midEnergy * 0.35);
      const ratio = fartBand / (highEnergy + 6);

      const sensitivity = parseInt(slider.value, 10);
      const minRatio = parseFloat(ratioSlider.value);
      const dynamicThreshold = noiseFloor + sensitivity;

      // Päivitetään taustamelun taso hitaasti, kun ääni ei ole aktiivinen
      if (!isSoundActive && fartBand < dynamicThreshold) {
        noiseFloor = noiseFloor * 0.97 + fartBand * 0.03;
      }

      // Visuaalinen mittari ja statistiikka
      const maxScale = Math.max(150, dynamicThreshold * 1.5);
      meterEl.style.width = Math.min((fartBand / maxScale) * 100, 100) + '%';
      thresholdLine.style.left = Math.min((dynamicThreshold / maxScale) * 100, 100) + '%';

      const isFartLike = fartBand > dynamicThreshold && ratio >= minRatio;
      meterEl.style.background = isFartLike
        ? 'var(--danger)'
        : (fartBand > dynamicThreshold ? 'var(--warn)' : 'var(--accent)');

      noiseStat.textContent = Math.round(noiseFloor);
      ratioStat.textContent = ratio.toFixed(1);

      const now = Date.now();

      if (isFartLike) {
        if (!isSoundActive) {
          isSoundActive = true;
          soundStartTime = now;
          peakEnergy = fartBand;
          lowSumEvent = lowEnergy;
          midSumEvent = midEnergy;
          frameCountEvent = 1;
        } else {
          if (fartBand > peakEnergy) peakEnergy = fartBand;
          lowSumEvent += lowEnergy;
          midSumEvent += midEnergy;
          frameCountEvent++;
        }
      } else if (isSoundActive) {
        const duration = now - soundStartTime;
        isSoundActive = false;

        // Suodatetaan pois lyhyet alle 140 ms napsahdukset
        if (duration >= 140) {
          fartCount++;
          countStat.textContent = fartCount;

          const avgLow = lowSumEvent / frameCountEvent;
          const avgMid = midSumEvent / frameCountEvent;

          if (duration > 700 || peakEnergy > dynamicThreshold * 1.7) {
            speakRoast('heavy');
          } else if (avgMid > avgLow * 1.15) {
            speakRoast('squeaker');
          } else if (duration > 320) {
            speakRoast('medium');
          } else {
            speakRoast('short');
          }
        }
      }
    }

    async function startListening() {
      try {
        window.speechSynthesis.getVoices();

        // Raaka mikrofoniääni: melunvaimennus pois päältä!
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.5;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        noiseFloor = 15;
        isListening = true;

        toggleBtn.textContent = 'Pysäytä';
        toggleBtn.className = 'btn-stop';
        statusEl.textContent = 'Kuunnellaan Eemiä (puheensuodatus päällä)...';
        analyzeAudio();
      } catch (err) {
        statusEl.textContent = 'Mikrofonin käyttö estetty tai vaatii HTTPS-yhteyden.';
        console.error(err);
      }
    }

    function stopListening() {
      isListening = false;
      cancelAnimationFrame(animationId);
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();

      meterEl.style.width = '0%';
      toggleBtn.textContent = 'Käynnistä kuuntelu';
      toggleBtn.className = 'btn-primary';
      statusEl.textContent = 'Pysäytetty';
    }

    toggleBtn.addEventListener('click', () => {
      if (isListening) stopListening();
      else startListening();
    });

    testBtn.addEventListener('click', () => {
      const cats = ['short', 'squeaker', 'medium', 'heavy'];
      speakRoast(cats[Math.floor(Math.random() * cats.length)]);
    });
  </script>
</body>
</html>
