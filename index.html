<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eemin Pierukommentaattori</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --text: #f0f2f5;
      --muted: #8b949e;
      --accent: #3fb950;
      --warn: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid #2a2f3a;
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; letter-spacing: -0.02em; }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

    .meter-container {
      width: 100%;
      height: 14px;
      background: #0b0d10;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.05s linear, background 0.1s;
    }
    .threshold-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--danger);
      left: 40%;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
    }

    .roast-box {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      line-height: 1.4;
      color: #e6edf3;
      background: #12151a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      font-style: italic;
    }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    button {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-stop { background: var(--danger); color: #fff; }
    .btn-secondary { background: #2a2f3a; color: var(--text); font-size: 0.9rem; }

    .slider-group {
      margin-top: 16px;
      text-align: left;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .slider-group label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
  </style>
</head>
<body>

  <div class="card">
    <h1>Eemin Pierukommentaattori</h1>
    <div id="status" class="status">Valmiustilassa</div>

    <div class="meter-container">
      <div id="meter" class="meter-fill"></div>
      <div id="thresholdLine" class="threshold-line"></div>
    </div>

    <div class="stats-row">
      <span>Tausta: <strong id="noiseStat">0</strong></span>
      <span>Suhde: <strong id="ratioStat">0.0</strong>x</span>
      <span>Eemin osumat: <strong id="countStat">0</strong></span>
    </div>

    <div id="roastBox" class="roast-box">
      "Paina käynnistä ja anna palaa, Eemi..."
    </div>

    <div class="controls">
      <button id="toggleBtn" class="btn-primary">Käynnistä kuuntelu</button>
      <button id="testBtn" class="btn-secondary">Testaa ääni & solvaus</button>
    </div>

    <div class="slider-group">
      <label>
        <span>Herkkyys (ylitys taustamelusta)</span>
        <span id="thresholdVal">35</span>
      </label>
      <input type="range" id="thresholdSlider" min="10" max="100" value="35">
    </div>

    <div class="slider-group">
      <label>
        <span>Puheensuodatus (Basso/Diskantti-suhde)</span>
        <span id="ratioVal">2.0</span>
      </label>
      <input type="range" id="ratioSlider" min="1.2" max="4.0" step="0.1" value="2.0">
    </div>
  </div>
